syntax = "proto3";

package hazkey.commands;

option optimize_for = LITE_RUNTIME;

// Request messages

message NewComposingText {}

message SetContext {
    string context = 1;
    int32 anchor = 2;
}

message InputChar {
    string text = 1;
}

message ModifierEvent {
    enum ModifierType {
        MODIFIER_TYPE_UNSPECIFIED = 0;
        SHIFT = 1;
    }

    enum EventType {
        EVENT_TYPE_UNSPECIFIED = 0;
        PRESS = 1;
        RELEASE = 2;
        CANCEL = 3;
    }

    ModifierType mod_type = 1;
    EventType event_type = 2;
}

message MoveCursor {
    int32 offset = 1;
}

message AdjustClauseBoundary {
    int32 offset = 1;
}

message PrefixComplete {
    int32 index = 1;
}

// 予測候補を先頭表記として確定する
// PrefixCompleteとは異なり、コミットは行わない
// 候補の残り読みを変換中テキストに追記し、確定した表記を後続のZenzai変換の先頭制約とする
message AcceptPrediction {
    int32 index = 1;
}

// フォーカス中の候補を支えるAzooKey学習メモリのエントリを削除し、候補リストを再構築する
// 同一 (読み、表記) ペアの格納済み全CID変種を照合対象とする
message DeleteCandidateLearningData {
    int32 index = 1;
}

message DeleteCandidateLearningDataResult {
    uint32 deleted_count = 1;
    CandidatesResult candidates = 2;
    string hiragana = 3;
}

message DeleteLeft {}

message DeleteRight {}

message GetComposingString {
    enum CharType {
        HIRAGANA = 0;
        KATAKANA_FULL = 1;
        KATAKANA_HALF = 2;
        ALPHABET_FULL = 3;
        ALPHABET_HALF = 4;
    }

    CharType char_type = 1;
    string current_preedit = 2;
}

message GetHiraganaWithCursor {}

message GetCandidates {
    bool is_suggest = 1;
}

message GetCurrentInputModeInfo {}

message SaveLearningData {}

// 現在の変換内容や候補リストをリセットせず、アクティブなプロファイルのZenzai有効化のみを切り替える
message ToggleZenzai {}

message ToggleZenzaiResult {
    bool enabled = 1;
}

// Response messages

message Text {
    string text = 1;
}

message TextWithCursor {
    string beforeCursosr = 1;
    string onCursor = 2;
    string afterCursor = 3;
}

message CandidatesResult {
    message Candidate {
        string text = 1;
        string sub_hiragana = 2;
        // AzooKey学習メモリがこの候補に一致するエントリを保持している場合にtrue ([削除可]注釈として表示される)
        optional bool has_learning_entry = 3;
    }

    repeated Candidate candidates = 1;
    string live_text = 2;
    int32 live_text_index = 3;
    int32 page_size = 4;
}

message ClauseBoundaryResult {
    CandidatesResult candidates = 1;
    string hiragana = 2;
}

message CurrentInputModeInfo {
    enum InputMode {
        NORMAL = 0;
        DIRECT = 1;
    }

    InputMode input_mode = 1;
}
