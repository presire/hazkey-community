syntax = "proto3";

package hazkey.commands;

option optimize_for = LITE_RUNTIME;

// Request messages

message NewComposingText {}

message SetContext {
    string context = 1;
    int32 anchor = 2;
}

message InputChar {
    string text = 1;
}

message ModifierEvent {
    enum ModifierType {
        MODIFIER_TYPE_UNSPECIFIED = 0;
        SHIFT = 1;
    }

    enum EventType {
        EVENT_TYPE_UNSPECIFIED = 0;
        PRESS = 1;
        RELEASE = 2;
    }

    ModifierType mod_type = 1;
    EventType event_type = 2;
}

message MoveCursor {
    int32 offset = 1;
}

message AdjustClauseBoundary {
    int32 offset = 1;
}

message PrefixComplete {
    int32 index = 1;
}

// [community] Accept a prediction candidate as a fixed leading notation.
// Unlike PrefixComplete this does not commit: the candidate's remaining
// ruby is appended to the composing text and the accepted notation becomes
// the leading constraint of subsequent Zenzai conversions.
message AcceptPrediction {
    int32 index = 1;
}

// [community] Delete the AzooKey learning-memory entries backing the focused
// candidate, then rebuild the candidate list. Matching covers every stored
// CID variant of the same (reading, surface) pair.
message DeleteCandidateLearningData {
    int32 index = 1;
}

message DeleteCandidateLearningDataResult {
    uint32 deleted_count = 1;
    CandidatesResult candidates = 2;
    string hiragana = 3;
}

message DeleteLeft {}

message DeleteRight {}

message GetComposingString {
    enum CharType {
        HIRAGANA = 0;
        KATAKANA_FULL = 1;
        KATAKANA_HALF = 2;
        ALPHABET_FULL = 3;
        ALPHABET_HALF = 4;
    }

    CharType char_type = 1;
    string current_preedit = 2;
}

message GetHiraganaWithCursor {}

message GetCandidates {
    bool is_suggest = 1;
}

message GetCurrentInputModeInfo {}

message SaveLearningData {}

// Response messages

message Text {
    string text = 1;
}

message TextWithCursor {
    string beforeCursosr = 1;
    string onCursor = 2;
    string afterCursor = 3;
}

message CandidatesResult {
    message Candidate {
        string text = 1;
        string sub_hiragana = 2;
        // [community] True when the AzooKey learning memory holds an entry
        // matching this candidate (shown as a "deletable" annotation).
        optional bool has_learning_entry = 3;
    }

    repeated Candidate candidates = 1;
    string live_text = 2;
    int32 live_text_index = 3;
    int32 page_size = 4;
}

message ClauseBoundaryResult {
    CandidatesResult candidates = 1;
    string hiragana = 2;
}

message CurrentInputModeInfo {
    enum InputMode {
        NORMAL = 0;
        DIRECT = 1;
    }

    InputMode input_mode = 1;
}
