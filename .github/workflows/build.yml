name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distro-packages:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 Trixie
            distro: debian
            image: debian:trixie
            package_type: deb
            package_suffix: trixie
            package_arch: amd64
            runner: ubuntu-24.04
            expected_machine: x86_64
            swift_target: x86_64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          - name: Debian 13 Trixie (ARM64)
            distro: debian
            image: debian:trixie
            package_type: deb
            package_suffix: trixie
            package_arch: arm64
            runner: ubuntu-24.04-arm
            expected_machine: aarch64
            swift_target: aarch64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404-aarch64/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04-aarch64.tar.gz
          - name: Ubuntu 26.04
            distro: debian
            image: ubuntu:26.04
            package_type: deb
            package_suffix: ubuntu2604
            package_arch: amd64
            runner: ubuntu-24.04
            expected_machine: x86_64
            swift_target: x86_64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          - name: Fedora 44
            distro: fedora
            image: fedora:44
            package_type: rpm
            package_suffix: fc44
            package_arch: x86_64
            runner: ubuntu-24.04
            expected_machine: x86_64
            swift_target: x86_64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          - name: openSUSE Leap 16
            distro: opensuse
            image: opensuse/leap:16
            package_type: rpm
            package_suffix: leap16
            package_arch: x86_64
            runner: ubuntu-24.04
            expected_machine: x86_64
            swift_target: x86_64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          - name: openSUSE Tumbleweed
            distro: opensuse
            image: opensuse/tumbleweed:latest
            package_type: rpm
            package_suffix: tumbleweed
            package_arch: x86_64
            runner: ubuntu-24.04
            expected_machine: x86_64
            swift_target: x86_64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Build and package inside container
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          PACKAGE_SUFFIX: ${{ matrix.package_suffix }}
          PACKAGE_ARCH: ${{ matrix.package_arch }}
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
          SWIFT_TARGET: ${{ matrix.swift_target }}
          SWIFT_URL: ${{ matrix.swift_url }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
        run: |
          rm -rf workdir packages rpmbuild hazkey.spec
          mkdir -p workdir packages

          docker run --rm -i \
            --ulimit nproc=-1:-1 \
            --pids-limit=-1 \
            --shm-size=1g \
            -e DISTRO="$DISTRO" \
            -e IMAGE="$IMAGE" \
            -e PACKAGE_TYPE="$PACKAGE_TYPE" \
            -e PACKAGE_SUFFIX="$PACKAGE_SUFFIX" \
            -e PACKAGE_ARCH="$PACKAGE_ARCH" \
            -e EXPECTED_MACHINE="$EXPECTED_MACHINE" \
            -e SWIFT_TARGET="$SWIFT_TARGET" \
            -e SWIFT_URL="$SWIFT_URL" \
            -e GITHUB_REF_NAME="$GITHUB_REF_NAME_VALUE" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$IMAGE" sh -s <<'EOF'
          set -eux

          case "$DISTRO" in
            debian)
              apt-get update
              apt-get install -y \
                build-essential ca-certificates curl git gettext gzip tar ninja-build pkg-config \
                cmake qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
                libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
                libibus-1.0-dev \
                libglx-dev libgl1-mesa-dev libxkbcommon-dev libvulkan-dev libncurses6 \
                glslc protobuf-compiler libprotobuf-dev dpkg-dev \
                spirv-headers
              ;;
            fedora)
              dnf install -y \
                @development-tools ca-certificates curl git gzip tar gettext \
                ninja-build pkgconf-pkg-config cmake rpm-build \
                qt6-qtbase-devel qt6-qttools-devel \
                fcitx5-devel fcitx5-qt-devel \
                ibus-devel \
                protobuf-compiler protobuf-devel protobuf-lite-devel \
                vulkan-headers vulkan-loader-devel mesa-vulkan-drivers \
                libglvnd-devel mesa-libGL-devel libxkbcommon-devel glslc glslang-devel \
                spirv-headers-devel
              ;;
            opensuse)
              zypper --non-interactive --gpg-auto-import-keys refresh
              zypper --non-interactive install --no-recommends \
                ca-certificates \
                pkg-config binutils gcc gcc-c++ git gzip glibc-static libbsd-devel libedit-devel libicu-devel \
                libcurl-devel ncurses-devel sqlite3-devel zlib-devel python3 \
                cmake ninja gettext-tools protobuf-devel fcitx5-devel \
                ibus-devel \
                qt6-base-devel qt6-tools-devel qt6-linguist-devel vulkan-headers \
                shaderc glslang-devel spirv-headers

              # Swift（Ubuntu 24.04 build）は libxml2.so.2 を必要とする。Tumbleweed は 2.14 の SONAME 更新後、
              # libxml2-16（libxml2.so.16）のみを提供するため、シンボリックリンクを作成する。
              if ! zypper --non-interactive install --no-recommends libxml2-2; then
                zypper --non-interactive install --no-recommends libxml2-16
                ln -sf libxml2.so.16 /usr/lib64/libxml2.so.2
              fi
              ;;
          esac

          if [ "$IMAGE" = "ubuntu:26.04" ]; then
            apt-get install -y libxml2-16
            ln -sf /usr/lib/x86_64-linux-gnu/libxml2.so.16 \
              /usr/lib/x86_64-linux-gnu/libxml2.so.2
          fi

           # コンテナーのアーキテクチャが、このマトリクス行で選択されたランナーと一致することをアサートする
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          if [ "$PACKAGE_TYPE" = "deb" ]; then
            test "$(dpkg-architecture -qDEB_HOST_ARCH)" = "$PACKAGE_ARCH"
          fi

          git config --global --add safe.directory /work/hazkey-server/llama.cpp

          rm -rf /work/swift
          mkdir -p /work/swift
          curl -fL --retry 5 --retry-all-errors -o /tmp/swift.tar.gz \
            "$SWIFT_URL"
          tar -xzf /tmp/swift.tar.gz --strip-components=1 -C /work/swift
          export PATH="/work/swift/usr/bin:$PATH"
          swift --version

          # Swiftツールチェーンのターゲットがこのマトリクス行と一致することをアサートする
          swiftc -print-target-info | grep -Fq "$SWIFT_TARGET"

          rm -rf build workdir packages
          mkdir -p workdir packages

          sed -i "s/Qt::Orientation::/Qt::/g" hazkey-settings/mainwindow.ui

          # ルート専用のサーバビルド (learninghistorydialog_test -> build_hazkey_server) に依存するターゲットを正しく解決するため、
          # リポジトリルートから1度だけ設定する
          # 実験的なIBusフロントエンドを有効にし、これらのpackageジョブで下記の個別のibus-hazkey .deb/.rpmも生成する
          # IBusファイルは、fcitx5-hazkeyに決して同梱しない (ステージングツリーのinstallアサーション後の分割手順を参照)
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DProtobuf_USE_STATIC_LIBS=OFF \
            -DENABLE_IBUS=ON

          # vulkan-shaders-genは、最大16個のglslcサブプロセスを並列にフォークするため、
          # 制約のあるCIコンテナではプロセステーブル上限を超え、shader symbolを暗黙に欠落させることがある
          # フォーク負荷を予測可能にするため、すべてで単一スレッドのshaderコンパイルを強制する
          export GGML_VULKAN_SHADER_MAX_PARALLEL=1

          # ルートのビルドツリーからinstallするアーティファクトと生成メタデータを単一スレッドでビルドし、
          # ステージングディレクトリへ1度だけinstallする
          # これらの生成ファイルはいずれもターゲットのため、ターゲット指定ビルドでは明示的に列挙する必要がある
          cmake --build build --target hazkey-settings fcitx5-hazkey fcitx5-hazkey-translation hazkey-addon.conf.in-fmt hazkey-im.conf.in-fmt org.fcitx.Fcitx5.Addon.Hazkey.metainfo.xml.in-fmt ibus-engine-hazkey ibus-hazkey-translations build_hazkey_server --parallel 1
          DESTDIR=/work/workdir cmake --install build

          # Emoji 17.0ステージングinstallアサーション: E17アセットがステージングツリーに存在し、E16アセットが存在しないこと
          test -f /work/workdir/usr/share/hazkey/emoji_all_E17.0.txt
          test ! -e /work/workdir/usr/share/hazkey/emoji_all_E16.0.txt

          # 住所辞書ステージングinstallアサーション: コンパイル済みLOUDSのみがステージングツリーに存在し、ソースTSVは含まれないこと
          test -f /work/workdir/usr/share/hazkey/AddressDictionary/louds/charID.chid
          test -n "$(find /work/workdir/usr/share/hazkey/AddressDictionary/louds -name '*.louds' -print -quit)"
          test ! -e /work/workdir/usr/share/hazkey/AddressDictionary/data
          test -z "$(find /work/workdir/usr/share/hazkey -name 'address_entries.tsv' -print -quit)"

          # アイコンステージングinstallアサーション: コミュニティ版のテーマ名 (hazkey-community) のSVGアイコンがステージングツリーに存在すること
          test -f /work/workdir/usr/share/icons/hicolor/scalable/apps/hazkey-community.svg

          # libllamaステージングinstallアサーション: 主要な3ライブラリがステージングツリーに存在すること
          # (install (CODE) がDESTDIRを無視し、backends/だけがpackageに入ったLeap 16のRPM自己依存失敗に対する回帰ガード)
          # GNUInstallDirsはLinuxディストリビューションに応じて lib、lib64、lib/<triplet>配下に配置する
          for _lib in libggml-base.so libggml.so libllama.so; do
            _found="$(find /work/workdir/usr -path "*/hazkey/libllama/${_lib}*" -print -quit)"
            test -n "$_found" || { echo "missing staged lib: $_lib" >&2; exit 1; }
            test -e "$_found" || { echo "dangling staged lib: $_found" >&2; exit 1; }
          done
          test -n "$(find /work/workdir/usr -path '*/hazkey/libllama/backends/*.so' -print -quit)"

          # IBusステージングinstallアサーション: component XML、engine binary、gettext catalogがステージングツリーに存在すること
          # ここでは、GNUInstallDirsがすべてのLinuxディストリビューションでengineをlibexec配下に配置するため、
          # ハードコードしたパスではなく、findコマンドで見つける
          test -f /work/workdir/usr/share/ibus/component/ibus-hazkey.xml
          _ibus_engine="$(find /work/workdir/usr -path '*libexec/ibus-hazkey/ibus-engine-hazkey' -print -quit)"
          test -n "$_ibus_engine" || { echo "missing staged IBus engine" >&2; exit 1; }
          test -x "$_ibus_engine" || { echo "staged IBus engine not executable" >&2; exit 1; }
          test -n "$(find /work/workdir/usr/share/locale -name 'ibus-hazkey.mo' -print -quit)" \
            || { echo "missing staged ibus-hazkey.mo" >&2; exit 1; }
          # component fileは、このcomponentのwell-known bus nameを宣言し、
          # install済みのengineはhazkey-serverに接続せず、engine descriptionを報告しなければならない
          # ("--xml"は、埋め込み済みのengine descriptionを出力し、ibus_init()前に終了する。src/main.cppを参照。
          #  component bus nameではなく、<engines> snippet を出力することに注意)
          grep -Fq 'org.freedesktop.IBus.Hazkey' /work/workdir/usr/share/ibus/component/ibus-hazkey.xml
          "$_ibus_engine" --xml | grep -Fq '<name>hazkey</name>'

          # IBusペイロードを共有ステージングツリーから分離する
          # IBusは個別のibus-hazkey packageとして提供し、fcitx5-hazkey packageに同梱してはならない
          # 注: このheredocは、Debian/Ubuntuではdashである
          #     sh上で実行するため、ループはPOSIX-sh互換に保つ
          # ("read -d"コマンドは使わない。移動対象のパスには改行がないため、改行区切りの"-print"は安全である)
          mkdir -p workdir-ibus
          (
            cd workdir
            find usr \( -path 'usr/share/ibus/component/ibus-hazkey.xml' \
              -o -path 'usr/libexec/ibus-hazkey/*' \
              -o -path 'usr/share/locale/*/LC_MESSAGES/ibus-hazkey.mo' \) \
              \( -type f -o -type l \) -print | while IFS= read -r _f; do
              mkdir -p "../workdir-ibus/$(dirname "$_f")"
              mv "$_f" "../workdir-ibus/$_f"
            done
          )
          # 空になったIBusディレクトリをfcitxツリーから削除する
          rmdir workdir/usr/libexec/ibus-hazkey workdir/usr/share/ibus/component 2>/dev/null || true
          test -z "$(cd workdir && find usr \( -path 'usr/share/ibus/*' -o -path 'usr/libexec/ibus-hazkey/*' -o -name 'ibus-hazkey*' \) -print -quit)" \
            || { echo "IBus payload remains in fcitx staging tree" >&2; exit 1; }

          # ibus-hazkeyをfcitx5-hazkeyと同様に単独install可能にするため、共有server/settingsペイロードをibusツリーへ複製する:
          # - usr/bin/ (hazkey-server wrapper、hazkey-settings symlink)
          # - usr/lib*/hazkey/ (server/settings binary、libllama runtime)
          # - usr/share/applications/、usr/share/hazkey/、usr/share/icons/
          # Fcitx固有のペイロード (fcitx5 addon、metainfo、fcitx5 .mo) は、fcitxツリーのみに残す
          # 複製 (mvではなくcp) は意図的であり、両packageが同じ共有ファイルを保持する
          mkdir -p workdir-ibus/usr
          if [ -d workdir/usr/bin ]; then
            cp -a workdir/usr/bin workdir-ibus/usr/
          fi
          for _shared in usr/share/applications usr/share/hazkey usr/share/icons; do
            if [ -d "workdir/$_shared" ]; then
              mkdir -p "workdir-ibus/$(dirname "$_shared")"
              rm -rf "workdir-ibus/$_shared"
              cp -a "workdir/$_shared" "workdir-ibus/$_shared"
            fi
          done
          # ライブラリディレクトリは、Linuxディストリビューションにより異なる (RPMでは/usr/lib64、DEBでは/usr/lib/<triplet>)
          # fcitx5サブディレクトリは決してコピーせず、hazkeyサブディレクトリだけをコピーする
          # dashでは不一致のglobがリテラルのまま残るため、明示的にスキップする
          for _libhazkey in workdir/usr/lib64/hazkey workdir/usr/lib/hazkey workdir/usr/lib/*/hazkey; do
            case "$_libhazkey" in '*'*) continue;; esac
            [ -d "$_libhazkey" ] || continue
            _dest="workdir-ibus/${_libhazkey#workdir/}"
            mkdir -p "$(dirname "$_dest")"
            rm -rf "$_dest"
            cp -a "$_libhazkey" "$_dest"
          done
          unset _shared _libhazkey _dest
          # 複製した共有ペイロードのステージングインストールアサーション:
          # ibusツリーは、fcitxツリーと同じディレクトリ群を保持し、fcitxツリーも引き続きそれらを保持すること (移動ではなくコピー)
          test -f workdir/usr/bin/hazkey-server
          test -f workdir-ibus/usr/bin/hazkey-server
          # usr/binのhazkey-settingsは、libdirペイロードへのsymlinkのため、
          # ステージングツリー内ではdanglingである (targetは、install後にのみ存在する)
          # "test -e"コマンドは、symlinkをたどりdangling linkで失敗するため、"test -L"コマンドでsymlink自体を受け入れる
          test -L workdir-ibus/usr/bin/hazkey-settings || test -e workdir-ibus/usr/bin/hazkey-settings \
            || { echo "missing staged ibus usr/bin/hazkey-settings" >&2; exit 1; }
          test -f workdir-ibus/usr/share/applications/hazkey-settings.desktop \
            || { echo "missing staged ibus applications desktop" >&2; exit 1; }
          test -f workdir-ibus/usr/share/hazkey/emoji_all_E17.0.txt \
            || { echo "missing staged ibus emoji dict" >&2; exit 1; }
          test -f workdir-ibus/usr/share/hazkey/AddressDictionary/louds/charID.chid \
            || { echo "missing staged ibus address dict" >&2; exit 1; }
          test -n "$(find workdir-ibus/usr/share/hazkey/AddressDictionary/louds -name '*.louds' -print -quit)" \
            || { echo "missing staged ibus address louds" >&2; exit 1; }
          test ! -e workdir-ibus/usr/share/hazkey/AddressDictionary/data \
            || { echo "ibus staging tree bundles address TSV source" >&2; exit 1; }
          test -z "$(cd workdir-ibus && find usr/share/hazkey -name 'address_entries.tsv' -print -quit)" \
            || { echo "ibus staging tree bundles address_entries.tsv" >&2; exit 1; }
          test -n "$(find workdir-ibus/usr/share/icons -type f -print -quit)" \
            || { echo "missing staged ibus icons" >&2; exit 1; }
          test -n "$(find workdir-ibus/usr -path '*hazkey/libllama/libllama.so*' -print -quit)" \
            || { echo "missing staged ibus libllama" >&2; exit 1; }
          test -n "$(find workdir-ibus/usr -path '*hazkey/hazkey-server' -print -quit)" \
            || { echo "missing staged ibus hazkey-server binary" >&2; exit 1; }
          test -n "$(find workdir-ibus/usr -path '*hazkey/hazkey-settings' -print -quit)" \
            || { echo "missing staged ibus hazkey-settings binary" >&2; exit 1; }
           # fcitx5 addon ペイロードが ibus ツリーに混入してはならない。
          test -z "$(cd workdir-ibus && find usr \( -path 'usr/share/fcitx5/*' -o -path 'usr/lib*/fcitx5/*' -o -path 'usr/share/metainfo/*Fcitx5*' -o -name 'fcitx5-hazkey*' \) -print -quit)" \
            || { echo "fcitx payload leaked into ibus staging tree" >&2; exit 1; }

          ref_name="${GITHUB_REF_NAME#v}"
          version="${ref_name%%[!0-9.]*}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]* ) ;;
            * ) version="0.2.29" ;;
          esac

          if [ "$PACKAGE_TYPE" = "deb" ]; then
            fcitx_deb="packages/fcitx5-hazkey_${version}-1~${PACKAGE_SUFFIX}_${PACKAGE_ARCH}.deb"
            ibus_deb="packages/ibus-hazkey_${version}-1~${PACKAGE_SUFFIX}_${PACKAGE_ARCH}.deb"
            mkdir -p workdir/DEBIAN
            {
              printf '%s\n' 'Package: fcitx5-hazkey'
              printf 'Version: %s\n' "${version}-1~${PACKAGE_SUFFIX}"
              printf '%s\n' 'Section: utils'
              printf '%s\n' 'Priority: optional'
              printf 'Architecture: %s\n' "$PACKAGE_ARCH"
              printf '%s\n' 'Maintainer: presire <presire@users.noreply.github.com>'
              printf '%s\n' 'Depends: fcitx5, libqt6widgets6, libqt6network6, libprotobuf-lite32t64, libvulkan1, libc6, libncurses6'
              # 両パッケージは、同じ共有server/settingsペイロード (usr/bin、usr/share/hazkey、libllama) を提供する
              # 双方向のUNVERSIONED Replacesにより、どちらのインストール順序でもsiblingのコピーを上書きできる
              # versioned "Replaces: ibus-hazkey (<< X)"は、同一バージョンのsiblingの上書きを許可しない (dpkgで計測。下記の共存インストールアサーションを参照)
              # Conflictsを追加してはならない:
              # 共存はサポートする (ただし、同時利用はサポートしない)
              printf '%s\n' 'Replaces: ibus-hazkey'
              printf '%s\n' 'Description: Hazkey Japanese input method for Fcitx5'
              printf '%s\n' ' Japanese input method using AzooKeyKanaKanjiConverter.'
              printf '%s\n' 'Homepage: https://github.com/presire/hazkey-community'
            } > workdir/DEBIAN/control
            dpkg-deb --build --root-owner-group workdir "$fcitx_deb"
            # ビルド済みパッケージのメタデータが、このマトリクス行の想定アーキテクチャを報告することをアサートする
            test "$(dpkg-deb --field "$fcitx_deb" Architecture)" = "$PACKAGE_ARCH"
            dpkg-deb --info "$fcitx_deb"
            dpkg-deb --contents "$fcitx_deb"
            # IBusペイロードがfcitx5-hazkeyパッケージに混入してはならない
            if dpkg-deb --contents "$fcitx_deb" | grep -Eq 'ibus-hazkey|share/ibus/component'; then
              echo "fcitx5-hazkey DEB bundles IBus payload" >&2
              exit 1
            fi
            # 同梱するlibllamaランタイムは、deb内に存在しなければならない
            # そうでなければ、hazkey-serverは起動時にlibllama.so.0の欠落で失敗する
            dpkg-deb --contents "$fcitx_deb" | grep -Fq 'hazkey/libllama/libllama.so'
            dpkg-deb --contents "$fcitx_deb" | grep -Fq 'share/hazkey/AddressDictionary/louds/charID.chid'
            # Debian 13 / Ubuntu 26.04は、protobuf liteランタイムをこのパッケージ名で提供する
            # コンパイラとヘッダはビルド依存関係のみであり、ランタイム依存関係にしてはならない
            dpkg-deb --field "$fcitx_deb" Depends | grep -Fq 'libprotobuf-lite32t64'
            if dpkg-deb --field "$fcitx_deb" Depends | grep -Eq '(^|, )(protobuf|protobuf-compiler|protobuf-dev|libprotobuf(-lite)?-dev)(,|$)'; then
              echo "DEB contains a protobuf compiler/development dependency" >&2
              exit 1
            fi
            mkdir -p workdir-ibus/DEBIAN
            {
              printf '%s\n' 'Package: ibus-hazkey'
              printf 'Version: %s\n' "${version}-1~${PACKAGE_SUFFIX}"
              printf '%s\n' 'Section: utils'
              printf '%s\n' 'Priority: optional'
              printf 'Architecture: %s\n' "$PACKAGE_ARCH"
              printf '%s\n' 'Maintainer: presire <presire@users.noreply.github.com>'
              # "libibus-1.0-5"は、Debian 13 / Ubuntu 26.04の両方で"libibus-1.0.so.5"ランタイムである
              # (1.5.xでSONAMEは安定している)
              # 共有server/settingsペイロード (hazkey-settings、hazkey-server vulkan/protobufランタイム) はこのパッケージに複製するため、
              # Qt/Vulkan/protobuf/ncursesのランタイム依存関係は、fcitx5-hazkeyと同じ (fcitx5を除き、ibusを追加)
              printf '%s\n' 'Depends: ibus, libibus-1.0-5, libqt6widgets6, libqt6network6, libprotobuf-lite32t64, libvulkan1, libc6, libncurses6'
              # 双方向・unversioned Replacesの逆側 (上記のfcitx5-hazkey controlを参照) :
              # どちらのインストール順序でも共有ペイロードを所有できる
              # Conflictsは不要: 共存をサポートする
              printf '%s\n' 'Replaces: fcitx5-hazkey'
              printf '%s\n' 'Description: Hazkey Japanese input method for IBus'
              printf '%s\n' ' Japanese input method using AzooKeyKanaKanjiConverter.'
              printf '%s\n' 'Homepage: https://github.com/presire/hazkey-community'
            } > workdir-ibus/DEBIAN/control
            dpkg-deb --build --root-owner-group workdir-ibus "$ibus_deb"
            test "$(dpkg-deb --field "$ibus_deb" Architecture)" = "$PACKAGE_ARCH"
            dpkg-deb --info "$ibus_deb"
            dpkg-deb --contents "$ibus_deb"
            # IBus component XMLとエンジンバイナリは、ibus-hazkeyパッケージ内に存在しなければならない
            # そうでなければ、IBusはエンジンを登録できない
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'share/ibus/component/ibus-hazkey.xml'
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'ibus-engine-hazkey'
            dpkg-deb --field "$ibus_deb" Depends | grep -Fq 'libibus-1.0-5'
            #共有server/settingsディレクトリ群は、fcitx5-hazkeyと同様にibus-hazkeyパッケージ内にも存在しなければならない
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'usr/bin/hazkey-server'
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'usr/bin/hazkey-settings'
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'hazkey/hazkey-server'
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'hazkey/hazkey-settings'
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'hazkey/libllama/libllama.so'
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'share/applications/hazkey-settings.desktop'
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'share/hazkey/emoji_all_E17.0.txt'
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'share/hazkey/AddressDictionary/louds/charID.chid'
            dpkg-deb --contents "$ibus_deb" | grep -Fq 'share/icons/hicolor'
            dpkg-deb --field "$ibus_deb" Depends | grep -Fq 'libprotobuf-lite32t64'
            # fcitx5アドオンペイロードがibus-hazkeyパッケージに混入してはならない
            if dpkg-deb --contents "$ibus_deb" | grep -Eq 'share/fcitx5/|lib/fcitx5|Fcitx5.*metainfo|fcitx5-hazkey'; then
              echo "ibus-hazkey DEB bundles fcitx payload" >&2
              exit 1
            fi
            if dpkg-deb --field "$ibus_deb" Depends | grep -Eq '(^|, )(protobuf|protobuf-compiler|protobuf-dev|libprotobuf(-lite)?-dev|fcitx5)(,|$)'; then
              echo "ibus-hazkey DEB contains a wrong-framework dependency" >&2
              exit 1
            fi
          else
            topdir=/work/rpmbuild
            mkdir -p "$topdir"
            {
              printf '%s\n' 'Name: fcitx5-hazkey'
              printf 'Version: %s\n' "$version"
              printf 'Release: %s\n' "1.${PACKAGE_SUFFIX}"
              printf '%s\n' 'Summary: Hazkey Japanese input method for Fcitx5'
              printf '%s\n' 'License: MIT'
              printf '%s\n' 'URL: https://github.com/presire/hazkey-community'
              printf 'BuildArch: %s\n' "$PACKAGE_ARCH"
              # 非ELF統合の依存関係だけを明示する
              # rpmbuildは、Qt、Vulkan、protobuf-lite、その他のランタイムの依存関係を"%files"内のELF SONAMEから導出する
              # パッケージ名は、FedoraとSUSEで異なるため、ビルド時のprotobufパッケージやLinuxディストリビューション固有のランタイムパッケージ名をここにハードコードしない
              printf '%s\n' 'Requires: fcitx5'
              printf '\n'
              printf '%s\n' '%description'
              printf '%s\n' 'Japanese input method using AzooKeyKanaKanjiConverter.'
              printf '\n'
              printf '%s\n' '%prep'
              printf '\n'
              printf '%s\n' '%build'
              printf '\n'
              printf '%s\n' '%install'
              printf '%s\n' 'rm -rf %{buildroot}'
              printf '%s\n' 'mkdir -p %{buildroot}/usr'
              printf '%s\n' 'cp -a /work/workdir/usr/. %{buildroot}/usr/'
              printf '\n'
              printf '%s\n' '%files'
              find workdir/usr \( -type f -o -type l \) -printf '/usr/%P\n'
            } > hazkey.spec
            rpmbuild -bb hazkey.spec \
              --define "_topdir $topdir" \
              --define "_builddir $topdir/BUILD" \
              --define "_buildrootdir $topdir/BUILDROOT" \
              --define "_rpmdir $topdir/RPMS" \
              --define "_srcrpmdir $topdir/SRPMS"
            find "$topdir/RPMS" -type f -name 'fcitx5-hazkey-*.rpm' -exec cp {} packages/ \;
            rpm_file="$(find packages -type f -name 'fcitx5-hazkey-*.rpm' -print -quit)"
            rpm_target="packages/fcitx5-hazkey-${version}-1.${PACKAGE_SUFFIX}.${PACKAGE_ARCH}.rpm"
            if [ "$rpm_file" != "$rpm_target" ]; then
              mv "$rpm_file" "$rpm_target"
            fi
            {
              printf '%s\n' 'Name: ibus-hazkey'
              printf 'Version: %s\n' "$version"
              printf 'Release: %s\n' "1.${PACKAGE_SUFFIX}"
              printf '%s\n' 'Summary: Hazkey Japanese input method for IBus'
              printf '%s\n' 'License: MIT'
              printf '%s\n' 'URL: https://github.com/presire/hazkey-community'
              printf 'BuildArch: %s\n' "$PACKAGE_ARCH"
              # 上記と同じ方針: IBus統合の依存関係だけを明示して、"libibus-1.0.so.5"などはエンジンのELF SONAMEから自動導出する
              printf '%s\n' 'Requires: ibus'
              printf '\n'
              printf '%s\n' '%description'
              printf '%s\n' 'Japanese input method using AzooKeyKanaKanjiConverter.'
              printf '\n'
              printf '%s\n' '%prep'
              printf '\n'
              printf '%s\n' '%build'
              printf '\n'
              printf '%s\n' '%install'
              printf '%s\n' 'rm -rf %{buildroot}'
              printf '%s\n' 'mkdir -p %{buildroot}/usr'
              printf '%s\n' 'cp -a /work/workdir-ibus/usr/. %{buildroot}/usr/'
              printf '\n'
              printf '%s\n' '%files'
              find workdir-ibus/usr \( -type f -o -type l \) -printf '/usr/%P\n'
            } > ibus-hazkey.spec
            rpmbuild -bb ibus-hazkey.spec \
              --define "_topdir $topdir" \
              --define "_builddir $topdir/BUILD" \
              --define "_buildrootdir $topdir/BUILDROOT" \
              --define "_rpmdir $topdir/RPMS" \
              --define "_srcrpmdir $topdir/SRPMS"
            find "$topdir/RPMS" -type f -name 'ibus-hazkey-*.rpm' -exec cp {} packages/ \;
            ibus_rpm_file="$(find packages -type f -name 'ibus-hazkey-*.rpm' -print -quit)"
            ibus_rpm_target="packages/ibus-hazkey-${version}-1.${PACKAGE_SUFFIX}.${PACKAGE_ARCH}.rpm"
            if [ "$ibus_rpm_file" != "$ibus_rpm_target" ]; then
              mv "$ibus_rpm_file" "$ibus_rpm_target"
            fi
            rpm -qp --requires "$rpm_target"
            rpm -qp --filesbypkg "$rpm_target"
            rpm -qp --requires "$ibus_rpm_target"
            rpm -qp --filesbypkg "$ibus_rpm_target"
            # IBusペイロードが、fcitx5-hazkeyパッケージに混入してはならない
            if rpm -qp --filesbypkg "$rpm_target" | grep -Fq 'ibus-hazkey'; then
              echo "fcitx5-hazkey RPM bundles IBus payload" >&2
              exit 1
            fi
            # 住所辞書LOUDSは、fcitx5-hazkeyパッケージ内に存在しなければならない
            rpm -qp --filesbypkg "$rpm_target" | grep -Fq 'share/hazkey/AddressDictionary/louds/charID.chid' \
              || { echo "fcitx5-hazkey RPM misses address dict" >&2; exit 1; }
            # IBus component XMLとengineバイナリは、ibus-hazkeyパッケージ内に存在しなければならない
            # そうでなければ、IBusはengineを登録できない
            rpm -qp --filesbypkg "$ibus_rpm_target" | grep -Fq 'ibus/component/ibus-hazkey.xml' \
              || { echo "ibus-hazkey RPM misses component XML" >&2; exit 1; }
            rpm -qp --filesbypkg "$ibus_rpm_target" | grep -Fq 'ibus-engine-hazkey' \
              || { echo "ibus-hazkey RPM misses engine binary" >&2; exit 1; }
            rpm -qp --requires "$ibus_rpm_target" | grep -Fqx 'ibus' \
              || { echo "ibus-hazkey RPM misses Requires: ibus" >&2; exit 1; }
            rpm -qp --requires "$ibus_rpm_target" | grep -Eq '^libibus-1\.0\.so\.5\(\)\(64bit\)$' \
              || { echo "ibus-hazkey RPM misses auto libibus SONAME require" >&2; exit 1; }
            # 共有server/settingsディレクトリ群は、fcitx5-hazkeyと同様にibus-hazkeyパッケージ内にも存在しなければならない
            for _ibus_shared in /usr/bin/hazkey-server /usr/bin/hazkey-settings \
                share/applications/hazkey-settings.desktop \
                share/hazkey/emoji_all_E17.0.txt share/hazkey/AddressDictionary/louds/charID.chid share/icons \
                hazkey/hazkey-server hazkey/hazkey-settings \
                hazkey/libllama/libllama.so; do
              rpm -qp --filesbypkg "$ibus_rpm_target" | grep -Fq "$_ibus_shared" \
                || { echo "ibus-hazkey RPM misses shared payload: $_ibus_shared" >&2; exit 1; }
            done
            # fcitx5アドオンペイロードがibus-hazkeyパッケージに混入してはならない
            if rpm -qp --filesbypkg "$ibus_rpm_target" | grep -Eq 'share/fcitx5/|lib/fcitx5|Fcitx5.*metainfo|fcitx5-hazkey'; then
              echo "ibus-hazkey RPM bundles fcitx payload" >&2
              exit 1
            fi
            # 同梱するlibllamaランタイムは、ibusパッケージ内でも自身のSONAME requiresを満たさなければならない (上記のfcitx5-hazkeyと同じ自己依存回帰ガード)
            rpm -qp --requires "$ibus_rpm_target" | grep -Eq '^libprotobuf-lite\.so\.[0-9.]+\(\)\(64bit\)$' \
              || { echo "ibus-hazkey RPM misses auto libprotobuf-lite SONAME require" >&2; exit 1; }
            for _bad_dep in protobuf protobuf-devel protobuf-compiler protobuf-lite-devel; do
              if rpm -qp --requires "$rpm_target" | grep -Fqx "$_bad_dep"; then
                echo "RPM contains a build-time protobuf dependency: $_bad_dep" >&2
                exit 1
              fi
            done
            rpm -qp --requires "$rpm_target" | grep -Eq '^libprotobuf-lite\.so\.[0-9.]+\(\)\(64bit\)$'
            # 自己依存回帰ガード:
            # パッケージはlibllamaをprivateに同梱するため、そのSONAMEに対する自動生成されたRequiresは、自身のProvidesで満たされなければならない
            # ステージングツリーに主要な3ライブラリが欠けると、Providesにも含まれず、
            # 例えば、zypperでは"'libggml-base.so.0()(64bit)' not found" を報告する
            for _soname in 'libggml-base.so.0()(64bit)' 'libggml.so.0()(64bit)' 'libllama.so.0()(64bit)'; do
              rpm -qp --provides "$rpm_target" | grep -Fq "$_soname" || { echo "RPM missing self-provide: $_soname" >&2; exit 1; }
              rpm -qp --provides "$ibus_rpm_target" | grep -Fq "$_soname" || { echo "ibus RPM missing self-provide: $_soname" >&2; exit 1; }
            done
          fi

          # -----------------------------------------------------------------
          # P2: 複製した共有server/settingsペイロード (hazkey-server、hazkey-settings、libllama、Emoji 17辞書、icon、applications entry) の
          #     共存インストール / 削除アサーション
          #
          # 計測済みのdpkgの意味論 (Debian 13 / Ubuntu 26.04) :
          #   * Replacesがなければ、2番目のインストールは、"trying to overwrite '...', which is also in package ..." で失敗する
          #   * 双方向のUNVERSIONED Replacesにより、どちらのインストール順序でも成功する
          #   * dpkgは共有パスを最後にインストールしたパッケージの所有物として記録するため、
          #     そのパッケージの"dpkg -r"コマンドは、siblingがインストール済みのまま共有ファイルを削除する (したがって、siblingは壊れる)
          #     他方のパッケージを削除すると共有ファイルは残る
          #     これは共有ペイロードレイアウトに固有の制約であり、将来の挙動変更を検出するためここでアサートする (READMEに記載する)
          #
          # RPMに"Replaces"相当はなく不要である:
          # rpm/dnf/zypperコマンドは同じパスを提供する2パッケージを共存インストールし、
          # siblingがインストール済みの間は、削除時に共有ファイルを保持する
          # Obsoletes ("rpm -i"を壊す) や Conflicts (共存を禁止する) を追加してはならない
          # -----------------------------------------------------------------
          if [ "$PACKAGE_TYPE" = "deb" ]; then
            # 生成するcontrolには双方向・unversioned Replacesが必要であり、Conflictsを含めてはならない
            # 完全一致: fieldは、bareなunversioned sibling名でなければならない
            # versioned "Replaces: sibling (<< X)"は、同一バージョンの上書きを許可しない (計測済み) ため、
            # versioned形式への回帰はこのアサーションで失敗させる
            # unversioned Replacesは、2フロントエンドで異なるpackage versionを混在させる構成をサポートしないことを意味する
            # (READMEは、同一バージョンの利用を記載する)
            test "$(dpkg-deb --field "$fcitx_deb" Replaces)" = "ibus-hazkey" \
              || { echo "fcitx5-hazkey DEB Replaces must be exactly 'ibus-hazkey'" >&2; exit 1; }
            test "$(dpkg-deb --field "$ibus_deb" Replaces)" = "fcitx5-hazkey" \
              || { echo "ibus-hazkey DEB Replaces must be exactly 'fcitx5-hazkey'" >&2; exit 1; }
            if [ -n "$(dpkg-deb --field "$fcitx_deb" Conflicts 2>/dev/null)" ] ||
               [ -n "$(dpkg-deb --field "$ibus_deb" Conflicts 2>/dev/null)" ]; then
              echo "unexpected Conflicts field in a hazkey DEB" >&2
              exit 1
            fi

            dpkg_probe_root() {
              rm -rf "$1"
              mkdir -p "$1/var/lib/dpkg/info" "$1/var/lib/dpkg/updates"
              : > "$1/var/lib/dpkg/status"
              : > "$1/var/lib/dpkg/available"
            }
            # 隔離ルート
            # これは、依存関係の解決ではなくファイル共存をテストするアサーションであり、
            # 使い捨てルートにはsiblingのDependsがないため、"--force-depends"オプションを用いる
            dpkg_probe() {
              _p2_root="$1"
              shift
              dpkg --root="$_p2_root" --force-not-root --force-bad-path \
                --force-depends "$@"
            }

            echo "### P2 DEB: install fcitx5-hazkey then ibus-hazkey"
            dpkg_probe_root /tmp/p2root-ab
            dpkg_probe /tmp/p2root-ab -i "$fcitx_deb"
            dpkg_probe /tmp/p2root-ab -i "$ibus_deb"
            dpkg --root=/tmp/p2root-ab -l fcitx5-hazkey ibus-hazkey \
              | grep -Eq '^ii[[:space:]]+fcitx5-hazkey' \
              || { echo "fcitx5-hazkey not installed after A->B" >&2; exit 1; }
            dpkg --root=/tmp/p2root-ab -l fcitx5-hazkey ibus-hazkey \
              | grep -Eq '^ii[[:space:]]+ibus-hazkey' \
              || { echo "ibus-hazkey not installed after A->B" >&2; exit 1; }
            test -e /tmp/p2root-ab/usr/bin/hazkey-server \
              || { echo "shared payload missing after A->B" >&2; exit 1; }

            echo "### P2 DEB: install ibus-hazkey then fcitx5-hazkey (reverse)"
            dpkg_probe_root /tmp/p2root-ba
            dpkg_probe /tmp/p2root-ba -i "$ibus_deb"
            dpkg_probe /tmp/p2root-ba -i "$fcitx_deb"
            dpkg --root=/tmp/p2root-ba -l fcitx5-hazkey ibus-hazkey \
              | grep -Eq '^ii[[:space:]]+fcitx5-hazkey' \
              || { echo "fcitx5-hazkey not installed after B->A" >&2; exit 1; }
            dpkg --root=/tmp/p2root-ba -l fcitx5-hazkey ibus-hazkey \
              | grep -Eq '^ii[[:space:]]+ibus-hazkey' \
              || { echo "ibus-hazkey not installed after B->A" >&2; exit 1; }

            echo "### P2 DEB: removing the last installer drops the shared payload"
            dpkg_probe_root /tmp/p2root-rmb
            dpkg_probe /tmp/p2root-rmb -i "$fcitx_deb"
            dpkg_probe /tmp/p2root-rmb -i "$ibus_deb"
            dpkg --root=/tmp/p2root-rmb -r ibus-hazkey
            dpkg --root=/tmp/p2root-rmb -l fcitx5-hazkey \
              | grep -Eq '^ii[[:space:]]+fcitx5-hazkey' \
              || { echo "fcitx5-hazkey lost after removing ibus-hazkey" >&2; exit 1; }
            test ! -e /tmp/p2root-rmb/usr/bin/hazkey-server \
              || { echo "shared payload unexpectedly kept after removing last installer" >&2; exit 1; }

            echo "### P2 DEB: removing the replaced package keeps the shared payload"
            dpkg_probe_root /tmp/p2root-rma
            dpkg_probe /tmp/p2root-rma -i "$fcitx_deb"
            dpkg_probe /tmp/p2root-rma -i "$ibus_deb"
            dpkg --root=/tmp/p2root-rma -r fcitx5-hazkey
            dpkg --root=/tmp/p2root-rma -l ibus-hazkey \
              | grep -Eq '^ii[[:space:]]+ibus-hazkey' \
              || { echo "ibus-hazkey lost after removing the replaced sibling" >&2; exit 1; }
            test -e /tmp/p2root-rma/usr/bin/hazkey-server \
              || { echo "shared payload lost after removing the replaced sibling" >&2; exit 1; }
          else
            # RPMは、Conflicts/Obsoletesを宣言してはならない (上記のヘッダコメントを参照)
            for _p2_rpm in "$rpm_target" "$ibus_rpm_target"; do
              test -z "$(rpm -qp --conflicts "$_p2_rpm" 2>/dev/null)" \
                || { echo "unexpected Conflicts in $_p2_rpm" >&2; exit 1; }
              test -z "$(rpm -qp --obsoletes "$_p2_rpm" 2>/dev/null)" \
                || { echo "unexpected Obsoletes in $_p2_rpm" >&2; exit 1; }
            done

            rpm_probe_cleanup() {
              # "rpm -e A B"はいずれかが存在しないと中断するため、それぞれを個別に削除する
              rpm -e --nodeps --noscripts ibus-hazkey 2>/dev/null || true
              rpm -e --nodeps --noscripts fcitx5-hazkey 2>/dev/null || true
            }

            echo "### P2 RPM: install fcitx5-hazkey then ibus-hazkey"
            rpm_probe_cleanup
            rpm -i --nodeps --noscripts "$rpm_target"
            rpm -i --nodeps --noscripts "$ibus_rpm_target"
            rpm -q fcitx5-hazkey ibus-hazkey >/dev/null \
              || { echo "RPM co-install failed" >&2; exit 1; }
            test -e /usr/bin/hazkey-server \
              || { echo "RPM shared payload missing after co-install" >&2; exit 1; }

            echo "### P2 RPM: removing one keeps the shared payload"
            rpm -e --nodeps --noscripts ibus-hazkey
            if rpm -q ibus-hazkey >/dev/null 2>&1; then
              echo "ibus-hazkey RPM not removed" >&2
              exit 1
            fi
            rpm -q fcitx5-hazkey >/dev/null \
              || { echo "fcitx5-hazkey RPM lost" >&2; exit 1; }
            test -e /usr/bin/hazkey-server \
              || { echo "RPM shared payload dropped when the sibling was removed" >&2; exit 1; }

            echo "### P2 RPM: reverse install order"
            rpm_probe_cleanup
            rpm -i --nodeps --noscripts "$ibus_rpm_target"
            rpm -i --nodeps --noscripts "$rpm_target"
            rpm -q fcitx5-hazkey ibus-hazkey >/dev/null \
              || { echo "RPM reverse co-install failed" >&2; exit 1; }
            rpm_probe_cleanup
            test ! -e /usr/bin/hazkey-server \
              || { echo "RPM shared payload kept after removing both packages" >&2; exit 1; }
          fi

          chmod -R a+rX packages
          EOF

      - name: Upload fcitx5-hazkey package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fcitx5-hazkey-${{ matrix.package_suffix }}-${{ matrix.package_arch }}
          path: packages/fcitx5-hazkey*
          if-no-files-found: error

      - name: Upload ibus-hazkey package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ibus-hazkey-${{ matrix.package_suffix }}-${{ matrix.package_arch }}
          path: packages/ibus-hazkey*
          if-no-files-found: error
