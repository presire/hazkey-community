name: Test

# Regression-test workflow: builds the project and runs CTest + Swift
# XCTest on every pull request and on every push to main.  It does NOT
# produce, install, or publish any packages — that is the job of
# build.yml / release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref so only the latest commit
  # is tested — saves runner minutes on rapid pushes.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{ matrix.expected_machine }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # Native (non-emulated) runners: x86_64 on ubuntu-24.04 and native
      # AArch64 on ubuntu-24.04-arm.  fail-fast is disabled so a regression
      # on one architecture still reports the other architecture's result.
      fail-fast: false
      matrix:
        include:
          # x86_64 / amd64: existing coverage, unchanged behaviour.
          - runner: ubuntu-24.04
            dpkg_arch: amd64
            expected_machine: x86_64
            cc: cc
            cxx: c++
            swift_target: x86_64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          # AArch64 / arm64: native ARM64 runner using the official
          # AArch64 Swift 6.3.3 archive for Ubuntu 24.04.
          - runner: ubuntu-24.04-arm
            dpkg_arch: arm64
            expected_machine: aarch64
            cc: gcc-14
            cxx: g++-14
            swift_target: aarch64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404-aarch64/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04-aarch64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Assert runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
          DPKG_ARCH: ${{ matrix.dpkg_arch }}
        run: |
          set -eux
          # Early guard against a misconfigured matrix/runner pairing,
          # e.g. an emulated runner or a matrix row accidentally landing
          # on the wrong architecture.
          test "$(uname -m)" = "${EXPECTED_MACHINE}"
          test "$(dpkg --print-architecture)" = "${DPKG_ARCH}"

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates curl git gettext gzip tar \
            ninja-build pkg-config \
            cmake qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            libglx-dev libgl1-mesa-dev libxkbcommon-dev libvulkan-dev \
            libncurses6 glslc protobuf-compiler libprotobuf-dev \
            spirv-headers

      - name: Install Swift 6.3.3 toolchain
        env:
          SWIFT_URL: ${{ matrix.swift_url }}
        run: |
          set -eux
          # Download the official Swift 6.3.3 release for Ubuntu 24.04.
          # The project requires Swift >= 6.1 (swift-tools-version: 6.1
          # in hazkey-server/Package.swift).  build.yml uses the same
          # 6.3.3-RELEASE toolchain.  Both the URL and the temporary
          # filename are architecture-aware via the matrix (the official
          # per-architecture archive basename embeds the target, e.g.
          # ...-ubuntu24.04-aarch64.tar.gz for the ARM64 runner).
          SWIFT_TARBALL="/tmp/$(basename "${SWIFT_URL}")"
          curl -fL --retry 5 --retry-all-errors \
            -o "${SWIFT_TARBALL}" \
            "${SWIFT_URL}"
          mkdir -p /opt/swift
          tar -xzf "${SWIFT_TARBALL}" --strip-components=1 -C /opt/swift
          echo "/opt/swift/usr/bin" >> "${GITHUB_PATH}"

      - name: Verify Swift version and target architecture
        env:
          SWIFT_TARGET: ${{ matrix.swift_target }}
        run: |
          set -eux
          swift --version
          # The official Swift archive is architecture-specific, so assert
          # that the downloaded toolchain exactly targets the triple this
          # matrix row requested.  swiftc -print-target-info emits the
          # resolved target triple (e.g. aarch64-unknown-linux-gnu or
          # x86_64-unknown-linux-gnu).
          swiftc -print-target-info 2>/dev/null | grep -qF -- "${SWIFT_TARGET}"

      - name: Fix llama.cpp safe.directory
        # git submodule operations inside nested repos trigger
        # "dubious ownership" errors without this.
        run: |
          git config --global --add safe.directory \
            "$(pwd)/hazkey-server/llama.cpp"

      - name: Workaround Qt::Orientation namespace
        # Some Qt6 versions in CI containers reject the
        # Qt::Orientation::Horizontal fully-qualified enum syntax in
        # mainwindow.ui.  build.yml applies the same sed.
        run: |
          sed -i 's/Qt::Orientation::/Qt::/g' \
            hazkey-settings/mainwindow.ui

      - name: Install GCC 14 (arm64)
        if: matrix.dpkg_arch == 'arm64'
        run: |
          set -eux
          sudo apt-get install -y gcc-14 g++-14

      - name: Verify GCC 14 accepts SME compiler flags (arm64)
        if: matrix.dpkg_arch == 'arm64'
        run: |
          set -eux
          gcc-14 --version
          g++-14 --version
          printf 'int main(void) { return 0; }\n' |
            gcc-14 -x c -march=armv9.2-a+dotprod+fp16+sve+i8mm+sme -fsyntax-only -
          printf 'int main(void) { return 0; }\n' |
            g++-14 -x c++ -march=armv9.2-a+dotprod+fp16+sve+i8mm+sme -fsyntax-only -

      - name: Configure project (CMake)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -eux
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DProtobuf_USE_STATIC_LIBS=OFF

      - name: Build C++ targets and tests
        run: |
          set -eux
          # vulkan-shaders-gen forks up to 16 glslc subprocesses in
          # parallel, which can exceed the process-table limit in
          # constrained CI containers and silently drop shader symbols.
          export GGML_VULKAN_SHADER_MAX_PARALLEL=1
          # Build C++ libraries, executables, and CTest-registered test
          # binaries (zenzai_model_management_test, keysequence_util_test,
          # userdict_model_test, live_convert_mode_test,
          # hazkey_candidate_selection_test, hazkey_client_rpc_probe_test,
          # hazkey_client_cache_test, candidate_refresh_coalescer_test,
          # hazkey_client_transact_safety_test, learninghistorydialog_test)
          # in parallel for speed.  learninghistorydialog_test additionally
          # depends on the Swift server build (build_hazkey_server), so it is
          # built serially in the step below.
          cmake --build build --target hazkey-settings --parallel
          cmake --build build --target fcitx5-hazkey --parallel
          cmake --build build --target zenzai_model_management_test --parallel
          cmake --build build --target keysequence_util_test --parallel
          cmake --build build --target userdict_model_test --parallel
          cmake --build build --target live_convert_mode_test --parallel
          cmake --build build --target hazkey_candidate_selection_test --parallel
          cmake --build build --target hazkey_client_rpc_probe_test --parallel
          cmake --build build --target hazkey_client_cache_test --parallel
          cmake --build build --target candidate_refresh_coalescer_test --parallel
          cmake --build build --target hazkey_client_transact_safety_test --parallel

      - name: Build Swift server & learninghistorydialog_test (single-threaded)
        run: |
          set -eux
          export GGML_VULKAN_SHADER_MAX_PARALLEL=1
          # Swift server and its dependent CTest target: single-threaded
          # build to avoid OOM on the runner.  build_swift.cmake retries
          # once on first failure.  learninghistorydialog_test carries
          # add_dependencies(learninghistorydialog_test build_hazkey_server),
          # so both targets are built together in this one serial pass.
          cmake --build build --target build_hazkey_server learninghistorydialog_test --parallel 1

      - name: Run CTest (C++ tests)
        run: |
          set -eux
          # keysequence_util_test links Qt6::Gui and needs a platform
          # plugin; there is no display on the headless CI runner, so
          # force the software "offscreen" platform instead of the
          # default "xcb".
          export QT_QPA_PLATFORM=offscreen
          cd build
          ctest --output-on-failure --schedule-random \
            --parallel "$(nproc)"

      - name: Install system dictionary
        # The learning-memory and history XCTest suites read the real
        # dictionary from the system location /usr/share/hazkey/Dictionary;
        # without it they fail their assertions, so stage the repository
        # dictionary right before running the Swift tests.
        run: |
          set -eux
          sudo mkdir -p /usr/share/hazkey
          sudo cp -a hazkey-server/azooKey_dictionary_storage/Dictionary /usr/share/hazkey/

      - name: Run Swift XCTest (ZenzaiSupport)
        run: |
          set -eux
          export LLAMA_LIB_DIR="${GITHUB_WORKSPACE}/build/bin"
          export LD_LIBRARY_PATH="${LLAMA_LIB_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          cd hazkey-server
          swift package resolve
          number_checkout=".build/checkouts/AzooKeyKanaKanjiConverter"
          number_source="${number_checkout}/Sources/KanaKanjiConverterModule/DictionaryManagement/JapaneseNumber.swift"
          number_patch="${GITHUB_WORKSPACE}/hazkey-server/patches/0003-fix-standalone-unit-japanese-number.patch"
           if ! grep -q "hazkey-community patch" "${number_source}"; then
             git -C "${number_checkout}" apply "${number_patch}"
           fi
           # The user-dictionary retry preservation fix (formerly
           # patches/0006-zenzai-preserve-user-dictionary.patch) is baked into
           # the converter fork's hazkey branch (commit 2cef753), so there is
           # nothing left to apply at build time.
           swift test --traits ZenzaiSupport -Xlinker "-L${LLAMA_LIB_DIR}"
