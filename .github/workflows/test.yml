name: Test

# 回帰テスト用ワークフロー:
# プロジェクトをビルドし、すべてのプルリクエストとmainブランチへのプッシュで、CTest + Swift XCTestを実行する
# パッケージの生成、インストール、公開は行わない (これらは、build.yml / release.ymlの役割である)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同じrefで古い実行をキャンセルし、最新コミットだけをテストする
  # 高速なプッシュ時のランナー時間を節約する
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{ matrix.expected_machine }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # ネイティブ (非エミュレート) ランナー:
      # ubuntu-24.04上のx86_64とubuntu-24.04-arm上のネイティブAArch64を使用する
      # 一方のアーキテクチャでの回帰時にも他方の結果を報告できるよう、fail-fastは無効にする
      fail-fast: false
      matrix:
        include:
          # x86_64 / amd64: 既存のカバレッジであり、挙動は不変である
          - runner: ubuntu-24.04
            dpkg_arch: amd64
            expected_machine: x86_64
            cc: cc
            cxx: c++
            swift_target: x86_64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          # AArch64 / arm64: Ubuntu 24.04向けの公式AArch64 Swift 6.3.3アーカイブを使用する
          # ネイティブARM64ランナーである
          - runner: ubuntu-24.04-arm
            dpkg_arch: arm64
            expected_machine: aarch64
            cc: gcc-14
            cxx: g++-14
            swift_target: aarch64-unknown-linux-gnu
            swift_url: https://download.swift.org/swift-6.3.3-release/ubuntu2404-aarch64/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04-aarch64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Assert runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
          DPKG_ARCH: ${{ matrix.dpkg_arch }}
        run: |
          set -eux
          # 設定誤りのマトリクス/ランナー組み合わせを早期に検出する
          # 例: エミュレートされたランナー、または誤ったアーキテクチャに配置されたマトリクス行
          test "$(uname -m)" = "${EXPECTED_MACHINE}"
          test "$(dpkg --print-architecture)" = "${DPKG_ARCH}"

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates curl git gettext gzip tar \
            ninja-build pkg-config \
            cmake qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            libibus-1.0-dev \
            libglx-dev libgl1-mesa-dev libxkbcommon-dev libvulkan-dev \
            libncurses6 glslc protobuf-compiler libprotobuf-dev \
            spirv-headers

      - name: Install Swift 6.3.3 toolchain
        env:
          SWIFT_URL: ${{ matrix.swift_url }}
        run: |
          set -eux
          # Ubuntu 24.04向け公式Swift 6.3.3リリースをダウンロードする
          # プロジェクトは、Swift >= 6.1を必要とする (hazkey-server/Package.swiftのswift-tools-version: 6.1)
          # build.ymlは、同じ6.3.3-RELEASEツールチェーンを使用する
          # URLと一時ファイル名は、マトリクスによりアーキテクチャ対応である
          # (公式のアーキテクチャ別アーカイブのbasenameにはtargetが含まれる。例: ARM64ランナーでは...-ubuntu24.04-aarch64.tar.gz)
          SWIFT_TARBALL="/tmp/$(basename "${SWIFT_URL}")"
          curl -fL --retry 5 --retry-all-errors \
            -o "${SWIFT_TARBALL}" \
            "${SWIFT_URL}"
          mkdir -p /opt/swift
          tar -xzf "${SWIFT_TARBALL}" --strip-components=1 -C /opt/swift
          echo "/opt/swift/usr/bin" >> "${GITHUB_PATH}"

      - name: Verify Swift version and target architecture
        env:
          SWIFT_TARGET: ${{ matrix.swift_target }}
        run: |
          set -eux
          swift --version
          # 公式Swiftアーカイブはアーキテクチャ固有のため、
          # ダウンロードしたツールチェーンがこのマトリクス行で指定したtripleを正確に対象とすることをアサートする
          # "swiftc -print-target-info"コマンドは、解決済みのtarget tripleを出力する
          # (例: aarch64-unknown-linux-gnu または x86_64-unknown-linux-gnu)
          swiftc -print-target-info 2>/dev/null | grep -qF -- "${SWIFT_TARGET}"

      - name: Fix llama.cpp safe.directory
        # ネストしたリポジトリ内のgit submodule操作では、これがないと"dubious ownership"エラーが発生する
        run: |
          git config --global --add safe.directory \
            "$(pwd)/hazkey-server/llama.cpp"

      - name: Workaround Qt::Orientation namespace
        # CIコンテナ内の一部のQt6 バージョンは、mainwindow.ui内の完全修飾enum構文"Qt::Orientation::Horizontal"を受け付けない
        # build.ymlでも同じsedを適用する
        run: |
          sed -i 's/Qt::Orientation::/Qt::/g' \
            hazkey-settings/mainwindow.ui

      - name: Install GCC 14 (arm64)
        if: matrix.dpkg_arch == 'arm64'
        run: |
          set -eux
          sudo apt-get install -y gcc-14 g++-14

      - name: Verify GCC 14 accepts SME compiler flags (arm64)
        if: matrix.dpkg_arch == 'arm64'
        run: |
          set -eux
          gcc-14 --version
          g++-14 --version
          printf 'int main(void) { return 0; }\n' |
            gcc-14 -x c -march=armv9.2-a+dotprod+fp16+sve+i8mm+sme -fsyntax-only -
          printf 'int main(void) { return 0; }\n' |
            g++-14 -x c++ -march=armv9.2-a+dotprod+fp16+sve+i8mm+sme -fsyntax-only -

      - name: Configure project (CMake)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -eux
          # 実験的なIBusフロントエンドは既定でOFFである
          # CIがibus-engine-hazkeyをビルドし、以下でCTestにより、ibus_hazkey_state_testを実行するため、ここで有効化する
          # (パッケージングへの影響はない: test.ymlはパッケージを生成しない)
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DProtobuf_USE_STATIC_LIBS=OFF \
            -DENABLE_IBUS=ON

      - name: Build C++ targets and tests
        run: |
          set -eux
          # vulkan-shaders-genは、最大16個のglslcサブプロセスを並列にフォークする
          # 制約のあるCIコンテナでは、プロセステーブル上限を超え、シェーダーシンボルが暗黙に欠落する可能性がある
          export GGML_VULKAN_SHADER_MAX_PARALLEL=1
          # C++ライブラリと実行ファイルを速度のため並列ビルドする
          cmake --build build --target hazkey-settings --parallel
          cmake --build build --target fcitx5-hazkey --parallel
          cmake --build build --target ibus-engine-hazkey --parallel
          # CTest登録済みテストバイナリは、CTestの一覧からビルド対象を自動導出する
          # テスト追加のたびに、ここへターゲットを手動で列挙する必要はない (列挙漏れによる"Not Run"を防ぐ)
          # このリポジトリでは、add_test()のテスト名とビルドターゲット名が一致する
          # learninghistorydialog_testは、Swiftサーバビルド (build_hazkey_server) にも依存するため、
          # 以下のステップで単一スレッドによりビルドする
          mapfile -t test_targets < <(
            ctest --test-dir build -N |
              sed -n 's/^ *Test *#[0-9]*: //p' |
              grep -vx 'learninghistorydialog_test'
          )
          # 導出に失敗して、テストを1件もビルドせずに通過することを防ぐ
          test "${#test_targets[@]}" -gt 0
          printf 'CTest targets: %s\n' "${test_targets[*]}"
          cmake --build build --target "${test_targets[@]}" --parallel

      - name: Build Swift server & learninghistorydialog_test (single-threaded)
        run: |
          set -eux
          export GGML_VULKAN_SHADER_MAX_PARALLEL=1
          # Swiftサーバと依存するCTestターゲットは、ランナー上のOOMを避けるため単一スレッドでビルドする
          # build_swift.cmakeは、初回失敗時に1回リトライする
          # learninghistorydialog_testは、add_dependencies(learninghistorydialog_test build_hazkey_server) を持つため、
          # この1回の直列処理で両ターゲットをともにビルドする
          cmake --build build --target build_hazkey_server learninghistorydialog_test --parallel 1

      - name: Run CTest (C++ tests)
        run: |
          set -eux
          # keysequence_util_testは、Qt6::Guiをリンクして、プラットフォームプラグインを必要とする
          # ヘッドレスCIランナーにはディスプレイがないため、既定の"xcb"ではなくソフトウェアの"offscreen"プラットフォームを強制する
          export QT_QPA_PLATFORM=offscreen
          cd build
          ctest --output-on-failure --schedule-random \
            --parallel "$(nproc)"

      - name: Install system dictionary
        # learning-memoryとhistoryのXCTest スイートは、システム上の/usr/share/hazkey-community/Dictionaryから実際の辞書を読み取る
        # これがないとアサーションに失敗するため、Swiftテスト実行直前にリポジトリの辞書を配置する
        run: |
          set -eux
          sudo mkdir -p /usr/share/hazkey-community
          sudo cp -a hazkey-server/azooKey_dictionary_storage/Dictionary /usr/share/hazkey-community/

      - name: Run Swift XCTest (ZenzaiSupport)
        run: |
          set -eux
          export LLAMA_LIB_DIR="${GITHUB_WORKSPACE}/build/bin"
          export LD_LIBRARY_PATH="${LLAMA_LIB_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          # swift testは、ninja installを経ないビルド木に対して直接実行されるため、
          # backendProbe.swiftが既定で参照するインストール後のsystemLibraryPathが存在せず、
          # BackendProbeのCPU専用フォールバックがバックエンドを発見できずZenzaiを無効化してしまう
          # (ConfigValidationTestsのZenzaiモデル切替系テストが失敗する)
          # GGML_BACKEND_DIRは、getZenzaiDevices()が読む明示上書き変数のため、ビルド木のbinを指定する
          export GGML_BACKEND_DIR="${LLAMA_LIB_DIR}"
          cd hazkey-server
          swift package resolve
          number_checkout=".build/checkouts/AzooKeyKanaKanjiConverter"
          number_source="${number_checkout}/Sources/KanaKanjiConverterModule/DictionaryManagement/JapaneseNumber.swift"
          number_patch="${GITHUB_WORKSPACE}/hazkey-server/patches/0003-fix-standalone-unit-japanese-number.patch"
          if ! grep -q "hazkey-community patch" "${number_source}"; then
            git -C "${number_checkout}" apply "${number_patch}"
          fi
          # user-dictionaryのリトライ保持修正 (旧patches/0006-zenzai-preserve-user-dictionary.patch) は、
          # AzooKeyKanaKanjiConverterフォークのhazkeyブランチ (commit 2cef753) に組み込み済みであるため、ビルド時に適用するものはない
          # Swift Buildではテストランナーの推移的なllama/ggml共有ライブラリが既定の探索範囲外に置かれるため、-rpath-linkで推移パスを指定する
          swift test --traits ZenzaiSupport -Xlinker "-L${LLAMA_LIB_DIR}" -Xlinker "-rpath-link" -Xlinker "${LLAMA_LIB_DIR}"

  selinux-policy:
    name: SELinux policy (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # ディストリビューションごとに、ポリシーの系統 (redhat / refpolicy) と基本ポリシーの型名が異なる
      # 1つが失敗しても、他の結果を報告できるよう、fail-fastは無効にする
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 Trixie
            image: debian:trixie
          - name: Ubuntu 26.04
            image: ubuntu:26.04
          - name: Fedora 44
            image: fedora:44
          - name: openSUSE Leap 16
            image: opensuse/leap:16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify SELinux policy module in container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eux
          # SELinuxポリシーモジュール (selinux/) だけを検証するため、サブモジュールやSwiftツールチェーンは不要である
          # コンテナ内ではSELinuxは動作しないが、次の項目はポリシーストアとコンパイラだけで検証できる
          #   - ビルド (Makefile / CMake) と、ポリシーストアへの読み込み
          #   - インストール先ごとのファイルコンテキスト
          #   - 許可規則 (TCP通信を許可しないこと、設定ファイルへの書き込み禁止など)
          # 検証の内容は、selinux/ci-verify.shに記述している
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${IMAGE}" sh /work/selinux/ci-verify.sh /tmp/hazkey_community.pp
